# Artifacts
# Uruchamia testy i zapisuje raport z testów jako artifact.

name: Zadanie 10 - Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Utworz folder na wyniki
        run: mkdir -p test-results

      - name: Uruchom testy i utworz raport
        run: pytest tests/ -v --junitxml=test-results/results.xml

      - name: Zapisz wyniki jako artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/results.xml