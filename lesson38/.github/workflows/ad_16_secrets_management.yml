# Secrets Management
# Pokazuje bezpieczne wykorzystanie secrets w GitHub Actions.

name: Zadanie 16 - Secrets Management

on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Sprawdz czy API_KEY istnieje
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "API_KEY nie zostal ustawiony."
            exit 1
          fi
          echo "API_KEY zostal poprawnie przekazany."

      - name: Wyswietl maskowana wartosc
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "::add-mask::$API_KEY"
          echo "Secret: $API_KEY"

      - name: Symulacja deploy z secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Rozpoczynam deploy..."
          echo "API_KEY jest dostepny dla procesu deploy."
          echo "Deploy completed."