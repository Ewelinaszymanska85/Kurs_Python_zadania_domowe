# Full CI/CD Pipeline
# Pipeline: lint -> test -> build -> deploy.

name: Zadanie 13 - Full CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj narzedzia
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Flake8
        run: flake8 . --max-line-length=88 --exclude=venv

      - name: Black check
        run: black --check . --exclude "venv"

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Uruchom testy z coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=term

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zbuduj Docker image
        run: docker build -t lekcja38-app .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Symulacja deploy
        run: echo "Deploying..."