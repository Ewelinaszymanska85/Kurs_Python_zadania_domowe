# Multi-Platform Testing
# Testuje aplikację na Ubuntu, macOS i Windows
# oraz na Pythonie 3.9, 3.10 i 3.11.

name: Zadanie 18 - Multi Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        python-version:
          - "3.9"
          - "3.10"
          - "3.11"

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Zainstaluj dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sprawdz wersje Pythona
        run: python --version

      - name: Uruchom testy
        run: pytest tests/ -v