# Conditional Steps
# Krok deploy wykonuje się tylko na branchu main
# i tylko wtedy, gdy wcześniejsze kroki zakończą się sukcesem.

name: Zadanie 12 - Conditional Steps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom testy
        run: pytest tests/ -v

      - name: Ready to deploy
        if: github.ref == 'refs/heads/main' && success()
        run: echo "Ready to deploy!"