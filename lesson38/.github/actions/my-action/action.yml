name: "Run tests and coverage"
description: "Uruchamia pytest z coverage i generuje badge"

runs:
  using: "composite"

  steps:
    - name: Zainstaluj narzedzia testowe
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov coverage-badge

    - name: Uruchom testy z coverage
      shell: bash
      run: |
        pytest tests/ --cov=. --cov-report=term
        coverage xml

    - name: Wygeneruj coverage badge
      shell: bash
      run: |
        coverage-badge -o coverage.svg -f