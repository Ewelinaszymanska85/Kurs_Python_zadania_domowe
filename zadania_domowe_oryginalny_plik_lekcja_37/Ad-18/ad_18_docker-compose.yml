services:
  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./ad_18_nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: ad_18_Dockerfile
    depends_on:
      - redis

  redis:
    image: redis:7-alpine