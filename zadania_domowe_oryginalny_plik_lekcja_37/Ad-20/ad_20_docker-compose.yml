services:
  frontend:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/ad_20_nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: ad_20_Dockerfile
    ports:
      - "8001:8000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: booksdb
      DB_USER: bookuser
      DB_PASSWORD: bookpassword
    depends_on:
      database:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: ad_20_Dockerfile
    command: ["celery", "-A", "ad_20_tasks", "worker", "--loglevel=info", "--pool=solo"]
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: booksdb
      DB_USER: bookuser
      DB_PASSWORD: bookpassword
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booksdb
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d booksdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine