services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./ad_11_nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ad_11_static:/usr/share/nginx/html/static:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: ad_10_Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: booksdb
      DB_USER: bookuser
      DB_PASSWORD: bookpassword
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booksdb
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d booksdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s