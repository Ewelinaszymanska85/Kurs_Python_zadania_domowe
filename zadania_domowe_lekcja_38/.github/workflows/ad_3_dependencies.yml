# Instalacja Dependencies
# Instaluje zależności z pliku requirements.txt.

name: Zadanie 3 - Dependencies

on:
  push:
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Aktualizuj pip
        run: python -m pip install --upgrade pip

      - name: Zainstaluj dependencies
        run: pip install -r requirements.txt

      - name: Sprawdz zainstalowane pakiety
        run: pip list