# Multi-Job Workflow
# Workflow zawiera trzy joby: lint, test i build.
# Build uruchamia się tylko wtedy, gdy lint i test zakończą się sukcesem.

name: Zadanie 9 - Multi Job

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom flake8
        run: flake8 . --max-line-length=88 --exclude=venv

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom testy
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Symuluj build aplikacji
        run: |
          echo "Lint i testy zakończone poprawnie."
          echo "Budowanie aplikacji..."
          mkdir build
          echo "Build completed" > build/result.txt

      - name: Pokaz wynik buildu
        run: cat build/result.txt