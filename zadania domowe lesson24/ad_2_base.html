<!--
Zadanie domowe 2 - Uwierzytelnianie i Autoryzacja
Dynamiczne linki w nawigacji w zależności od stanu logowania.

Fragment szablonu bazowego pokazujący różne linki dla użytkowników
zalogowanych i niezalogowanych.
-->
<nav>
    <a href="/">Strona główna</a>
    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Profil</a>
        <form method="POST" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" style="background: none; border: none; color: white; text-decoration: underline; cursor: pointer; padding: 0; font-size: 1em;">Wyloguj</button>
        </form>
        <span style="color: #ccc; float: right;">Witaj, {{ user.username }}!</span>
    {% else %}
        <a href="{% url 'login' %}">Zaloguj</a>
        <a href="{% url 'register' %}">Zarejestruj</a>
    {% endif %}
</nav>
